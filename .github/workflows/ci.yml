---
name: ci

# Pushes to main run on the NodeRings org runner (noderings-ci); pull requests,
# including from forks, and manual runs stay on GitHub-hosted runners, so
# untrusted code never reaches our machines. Jobs that install system packages
# with sudo always run GitHub-hosted.
"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly live API tests (free Kitchen suites). Skips when NODERINGS_TOKEN is unset.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Cinc Workstation
        run: command -v cookstyle >/dev/null || curl -fsSL https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-workstation -v 26
      - name: Cookstyle
        run: cookstyle --display-cop-names --extra-details
      - name: ChefSpec
        run: cinc exec rspec

  markdown-yaml:
    # Pushes to main run on the org runner; pull requests and everything else stay GitHub-hosted.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@36744e48c825cb8d549f6353f8837505de1922c7 # v25.1.0
        with:
          globs: "**/*.md"
      # The org runner has no yamllint preinstalled (GitHub-hosted images do).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: yamllint
        run: |
          pip install yamllint
          yamllint .

  # Calls the real NodeRings API. Runs when the NODERINGS_TOKEN secret is set,
  # on pushes and on pull requests from this repository.
  integration:
    needs: lint-unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NODERINGS_TOKEN: ${{ secrets.NODERINGS_TOKEN }}
      NODERINGS_TEST_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      KITCHEN_LOCAL_YAML: kitchen.exec.yml
    steps:
      - name: Skip when NODERINGS_TOKEN is not set
        if: env.NODERINGS_TOKEN == ''
        run: echo "::notice title=Live tests skipped::Add the repository secret NODERINGS_TOKEN (a service account token for a test organization) to run them."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.NODERINGS_TOKEN != ''
        with:
          persist-credentials: false
      - name: Install Cinc Workstation
        if: env.NODERINGS_TOKEN != ''
        run: command -v cookstyle >/dev/null || curl -fsSL https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-workstation -v 26
      - name: Converge and verify
        if: env.NODERINGS_TOKEN != ''
        run: kitchen test default-local
      - name: Clean up
        if: always() && env.NODERINGS_TOKEN != ''
        run: kitchen test cleanup-local
